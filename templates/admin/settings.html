{% extends "admin/base.html" %}
{% block title %}Shop Settings{% endblock %}
{% block admin_content %}
<h1 class="page-title">Shop settings</h1>

<form method="POST" enctype="multipart/form-data" class="panel form-grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Shop name <input type="text" name="shop_name" value="{{ shop.shop_name }}" required></label>
    <label>Established (since) <input type="number" name="since" value="{{ shop.since or '' }}" min="1900" max="2100"></label>

    <label class="col-span">Description <textarea name="shop_description" rows="3">{{ shop.shop_description or '' }}</textarea></label>

    <label>Contact email <input type="email" name="contact_email" value="{{ shop.contact_email or '' }}"></label>
    <label>Contact phone <input type="text" name="contact_phone" value="{{ shop.contact_phone or '' }}"></label>
    <label class="col-span">Address <input type="text" name="address" value="{{ shop.address or '' }}"></label>

    <label>Currency <input type="text" name="currency" value="{{ shop.currency }}"></label>
    <label>Shipping fee ({{ shop.currency }}) <input type="number" step="0.01" min="0" name="shipping_fee"
        value="{{ '%.2f'|format(shop.shipping_fee/100) }}"></label>
    <label>Tax percent <input type="number" step="0.01" min="0" name="tax_percent" value="{{ shop.tax_percent }}"></label>

    <label>Logo <input type="file" name="logo" accept="image/*"></label>
    <label>Or logo path <input type="text" name="logo_path" value="{{ shop.logo_path or '' }}"></label>

    <div class="col-span actions">
        <button class="btn" type="submit">Save settings</button>
    </div>
</form>
{% endblock %}
