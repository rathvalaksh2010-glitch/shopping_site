{% extends "admin/base.html" %}
{% block title %}{{ "Edit" if product else "New" }} Product{% endblock %}
{% block admin_content %}
<h1 class="page-title">{{ "Edit" if product else "Add" }} product</h1>

<form method="POST" enctype="multipart/form-data" class="panel form-grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="col-span">Name <input type="text" name="name" value="{{ product.name if product else '' }}" required></label>

    <label>Category
        <select name="category_id">
            <option value="">Uncategorised</option>
            {% for c in categories %}
            <option value="{{ c.id }}" {% if product and product.category_id==c.id %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Price ({{ shop.currency }}) <input type="number" step="0.01" min="0" name="price"
        value="{{ '%.2f'|format(product.price/100) if product else '' }}" required></label>

    <label class="col-span">Description <textarea name="description" rows="4">{{ product.description if product else '' }}</textarea></label>

    <label>Product image <input type="file" name="image" accept="image/*"></label>
    <label>Or image path <input type="text" name="image_path" value="{{ product.image_path if product else '' }}"></label>

    {% if not product %}
    <label>Opening stock <input type="number" name="quantity" value="0" min="0"></label>
    <label>Low-stock threshold <input type="number" name="low_stock_threshold" value="5" min="0"></label>
    {% endif %}

    <label class="checkbox col-span"><input type="checkbox" name="is_active" {% if not product or product.is_active %}checked{% endif %}> Active</label>

    <div class="col-span actions">
        <button class="btn" type="submit">Save product</button>
        <a class="btn ghost" href="{{ url_for('admin_products') }}">Cancel</a>
    </div>
</form>
{% endblock %}
