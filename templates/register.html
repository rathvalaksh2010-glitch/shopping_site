{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-card">
    <h2>Create account</h2>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Name <input type="text" name="name" value="{{ request.form.get('name','') }}" required></label>
        <label>Email <input type="email" name="email" value="{{ request.form.get('email','') }}" required></label>
        <label>Password <input type="password" name="password" minlength="8" required></label>
        <label>Confirm password <input type="password" name="confirm" minlength="8" required></label>
        <label class="checkbox"><input type="checkbox" name="accept_terms" required> I accept the <a href="{{ url_for('terms') }}">terms</a> and <a href="{{ url_for('privacy') }}">privacy policy</a></label>
        <button class="btn full" type="submit">Register</button>
    </form>
    <p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
